<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Learning Plan — MET Humber 2026–2029</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0efec;
      color: #1c1c1a;
      padding: 28px 16px 60px;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.5;
    }

    /* ── Header ── */
    .plan-header { padding: 0 0 6px; }
    .plan-header h2 { font-size: 17px; font-weight: 500; color: #1c1c1a; margin: 0 0 3px; }
    .plan-header p  { font-size: 13px; color: #6b6b68; margin: 0 0 14px; }

    /* ── Year labels ── */
    .year-label {
      font-size: 11px; font-weight: 500; letter-spacing: 0.06em;
      text-transform: uppercase; color: #9b9b98;
      margin: 22px 0 8px; padding-left: 2px;
    }

    /* ── Cards ── */
    .card {
      border: 1px solid #e2e2df; border-radius: 10px;
      padding: 18px 18px 16px; margin-bottom: 14px;
      background: #fafaf9;
    }
    .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .badge { font-size: 11px; font-weight: 500; padding: 3px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
    .s0  .badge { background: #2C2C2A; color: #D3D1C7; }
    .s1  .badge { background: #E6F1FB; color: #0C447C; }
    .s2  .badge { background: #E1F5EE; color: #085041; }
    .ss1 .badge { background: #F1EFE8; color: #5F5E5A; }
    .s3  .badge { background: #EEEDFE; color: #3C3489; }
    .s4  .badge { background: #FAEEDA; color: #633806; }
    .ss2 .badge { background: #F1EFE8; color: #5F5E5A; }
    .s5  .badge { background: #FAECE7; color: #712B13; }
    .s6  .badge { background: #EAF3DE; color: #27500A; }
    .card-title  { font-size: 14px; font-weight: 500; color: #1c1c1a; }
    .card-season { font-size: 12px; color: #9b9b98; margin-left: auto; white-space: nowrap; }
    .theme {
      font-size: 12px; color: #6b6b68; margin-bottom: 12px;
      padding-bottom: 10px; border-bottom: 1px solid #e2e2df;
    }

    /* ── Two-column skills / resources ── */
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
    .col-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: #9b9b98; margin-bottom: 7px;
    }
    .item { font-size: 12px; color: #1c1c1a; margin-bottom: 5px; display: flex; gap: 7px; line-height: 1.5; }
    .dot { width: 5px; height: 5px; border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .s0  .dot { background: #888780; } .s1  .dot { background: #185FA5; }
    .s2  .dot { background: #0F6E56; } .ss1 .dot { background: #888780; }
    .s3  .dot { background: #534AB7; } .s4  .dot { background: #854F0B; }
    .ss2 .dot { background: #888780; } .s5  .dot { background: #993C1D; }
    .s6  .dot { background: #3B6D11; } .dot.hl { background: #534AB7; }

    /* ── Timeline ── */
    .timeline { padding-top: 12px; border-top: 1px solid #e2e2df; }
    .tl-label {
      font-size: 10px; font-weight: 500; letter-spacing: 0.05em;
      text-transform: uppercase; color: #9b9b98;
      margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center;
    }
    .tl-progress-text { font-size: 10px; color: #9b9b98; font-weight: 400; letter-spacing: 0; text-transform: none; }

    .prog-wrap { height: 3px; background: #e2e2df; border-radius: 2px; margin-bottom: 10px; }
    .prog-fill  { height: 100%; border-radius: 2px; transition: width 0.3s ease; }
    .s0  .prog-fill { background: #888780; } .s1  .prog-fill { background: #185FA5; }
    .s2  .prog-fill { background: #0F6E56; } .ss1 .prog-fill { background: #888780; }
    .s3  .prog-fill { background: #534AB7; } .s4  .prog-fill { background: #854F0B; }
    .ss2 .prog-fill { background: #888780; } .s5  .prog-fill { background: #993C1D; }
    .s6  .prog-fill { background: #3B6D11; }

    .tl-week {
      font-size: 11px; font-weight: 500; color: #9b9b98;
      white-space: nowrap; width: 62px; flex-shrink: 0; padding-top: 3px;
    }
    .tl-content { font-size: 12px; color: #1c1c1a; line-height: 1.5; flex: 1; transition: opacity 0.2s; }
    .tl-content.done { opacity: 0.35; text-decoration: line-through; }

    .tag-core    { background: #E6F1FB; color: #0C447C; }
    .tag-project { background: #EAF3DE; color: #27500A; }
    .tag-ml      { background: #E1F5EE; color: #085041; }
    .tag-cv      { background: #FAEEDA; color: #633806; }
    .tag-adv     { background: #FAECE7; color: #712B13; }
    .tag-cap     { background: #EAF3DE; color: #173404; }

    /* Project goal box */
    .project-box {
      margin-top: 14px; padding: 9px 12px; font-size: 12px; line-height: 1.5;
      border-left: 3px solid; display: flex; gap: 10px; align-items: flex-start;
    }
    .s0  .project-box { background: #F1EFE8; color: #2C2C2A; border-color: #888780; }
    .s1  .project-box { background: #E6F1FB; color: #042C53; border-color: #185FA5; }
    .s2  .project-box { background: #E1F5EE; color: #04342C; border-color: #0F6E56; }
    .ss1 .project-box { background: #F1EFE8; color: #2C2C2A; border-color: #888780; }
    .s3  .project-box { background: #EEEDFE; color: #26215C; border-color: #534AB7; }
    .s4  .project-box { background: #FAEEDA; color: #412402; border-color: #854F0B; }
    .ss2 .project-box { background: #F1EFE8; color: #2C2C2A; border-color: #888780; }
    .s5  .project-box { background: #FAECE7; color: #4A1B0C; border-color: #993C1D; }
    .s6  .project-box { background: #EAF3DE; color: #173404; border-color: #3B6D11; }
    .project-label { font-weight: 500; margin-bottom: 2px; }
    .project-text.done { opacity: 0.35; text-decoration: line-through; }

    /* ── Checkboxes ── */
    .cb {
      width: 15px; height: 15px; border-radius: 3px; border: 1.5px solid;
      flex-shrink: 0; cursor: pointer; display: flex; align-items: center;
      justify-content: center; margin-top: 1px; transition: all 0.15s;
      user-select: none; opacity: 0.4;
    }
    .cb:hover { opacity: 0.7; transform: scale(1.08); }
    .cb.checked { opacity: 1; }
    .cb svg { display: none; width: 9px; height: 9px; }
    .cb.checked svg { display: block; }

    /* ── Top summary bar ── */
    .top-summary {
      background: #fafaf9; border: 1px solid #e2e2df; border-radius: 10px;
      padding: 14px 16px; margin-bottom: 20px;
    }
    .top-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .top-label { font-size: 13px; font-weight: 500; color: #1c1c1a; }
    .top-count { font-size: 12px; color: #6b6b68; }
    .top-bar  { height: 5px; background: #e2e2df; border-radius: 3px; }
    .top-fill { height: 100%; border-radius: 3px; background: #534AB7; transition: width 0.3s ease; }

    /* ── Save indicator ── */
    .save-toast {
      position: fixed; bottom: 20px; right: 20px;
      background: #1c1c1a; color: #fafaf9;
      font-size: 12px; padding: 8px 14px; border-radius: 6px;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .save-toast.show { opacity: 1; }

    @media (max-width: 520px) {
      .cols { grid-template-columns: 1fr; }
      .card-season { display: none; }
    }
  </style>
</head>

      {id:'s6m4', week:'Month 4', tag:'Portfolio', tc:'tag-project', text:'Create a GitHub Pages portfolio with one page per major project, descriptions, results and live-demo links. Finish the capstone submission and make the portfolio live.'}
    ],
    pid:'s6p', plabel:'Goal at graduation',
    project:"An AI component embedded in your industrial capstone, a GitHub portfolio with 6+ projects spanning materials analysis, regression, anomaly detection, computer vision, generative design, and surrogate simulation — plus a live deployed model. That's what separates you from every other MET grad."
  }
];

const YEAR_BEFORE = {
  s0:  'Pre-program — Summer 2026',
  s1:  'Year 1 — 2026–2027',
  s3:  'Year 2 — 2027–2028',
  s5:  'Year 3 — 2028–2029'
};

/* ── State ── */
let checked = {};

function migrateProgress() {
  try {
    const oldRaw = localStorage.getItem('met-ai-plan-nikhil-v2');
    if (!oldRaw || localStorage.getItem(STORAGE_KEY)) return;
    const old = JSON.parse(oldRaw);
    // Preserve only Semester 0 Week 1, which is now Semester 0 Month 1.
    if (old && old.s0w1) checked.s0w1 = true;
  } catch(e) {}
}

function save() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(checked));
    flashToast();
  } catch(e) { console.warn('Save failed', e); }
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) checked = JSON.parse(raw);
  } catch(e) { checked = {}; }
}

/* ── Toast ── */
let toastTimer;
function flashToast() {
  const t = document.getElementById('toast');
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

/* ── Toggle ── */
function toggle(id) {
  checked[id] = !checked[id];
  save();
  render();
}

/* ── Totals ── */
function grandTotal() { return PLAN.reduce((a,s) => a + s.weeks.length + 1, 0); }
function grandDone()  { return Object.values(checked).filter(Boolean).length; }

/* ── Checkbox HTML ── */
function cb(id, cls) {
  const on  = !!checked[id];
  const col = COLORS[cls];
  return `<div class="cb${on?' checked':''}" onclick="toggle('${id}')"
    style="border-color:${col};${on?'background:'+col+';':''}">
    <svg viewBox="0 0 10 8" fill="none">
      <path d="M1 4L3.5 6.5L9 1" stroke="white" stroke-width="1.8"
            stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>`;
}

/* ── Render ── */
function render() {
  const tot  = grandTotal();
  const done = grandDone();
  const pct  = tot ? Math.round(done / tot * 100) : 0;

  let h = `
    <div class="plan-header">
      <h2>AI learning plan — month-by-month</h2>
      <p>9 periods · Mechanical Engineering Technology · Humber Polytechnic · 2026–2029</p>
    </div>
    <div class="top-summary">
      <div class="top-row">
        <span class="top-label">Overall progress</span>
        <span class="top-count">${done} / ${tot} completed &middot; ${pct}%</span>
      </div>
      <div class="top-bar"><div class="top-fill" style="width:${pct}%"></div></div>
    </div>`;

  PLAN.forEach(s => {
    if (YEAR_BEFORE[s.id]) {
      h += `<div class="year-label">${YEAR_BEFORE[s.id]}</div>`;
    }

    const sDone  = s.weeks.filter(w => checked[w.id]).length + (checked[s.pid] ? 1 : 0);
    const sTotal = s.weeks.length + 1;
    const sPct   = Math.round(sDone / sTotal * 100);

    h += `
    <div class="card ${s.cls}">
      <div class="card-head">
        <span class="badge">${s.badge}</span>
        <span class="card-title">${s.title}</span>
        <span class="card-season">${s.season}</span>
      </div>
      <div class="theme">${s.theme}</div>
      <div class="cols">
        <div>
          <div class="col-label">AI skills to build</div>
          ${s.skills.map(x => `<div class="item"><span class="dot${x.hl?' hl':''}"></span>${x.t}</div>`).join('')}
        </div>
        <div>
          <div class="col-label">Resources</div>
          ${s.resources.map(x => `<div class="item"><span class="dot${x.hl?' hl':''}"></span>${x.t}</div>`).join('')}
        </div>
      </div>
      <div class="timeline">
        <div class="tl-label">
          <span>Month by month</span>
          <span class="tl-progress-text">${sDone} / ${sTotal} done</span>
        </div>
        <div class="prog-wrap"><div class="prog-fill" style="width:${sPct}%"></div></div>
        ${s.weeks.map(w => `
        <div class="tl-row">
          ${cb(w.id, s.cls)}
          <span class="tl-week">${w.week}</span>
          <span class="tl-content${checked[w.id]?' done':''}"
            ><span class="tl-tag ${w.tc}">${w.tag}</span>${w.text}</span>
        </div>`).join('')}
      </div>
      <div class="project-box">
        ${cb(s.pid, s.cls)}
        <div>
          <div class="project-label">${s.plabel}</div>
          <div class="project-text${checked[s.pid]?' done':''}">${s.project}</div>
        </div>
      </div>
    </div>`;
  });

  document.getElementById('root').innerHTML = h;
}

/* ── Init ── */
migrateProgress();
load();
render();

/* ── Also save on tab/window close as a safety net ── */
window.addEventListener('beforeunload', () => {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(checked)); } catch(e) {}
});
</script>
</body>
</html>
